<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBio ChatBot</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #3F8443;
            --primary-dark: #0A3E2E;
            --bg: #f3f4f6;
            --white: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: var(--bg);
            height:100vh;
            display:flex;
            flex-direction:column;
        }

        .navbar{
            background: white;
            padding:20px 40px;
            border-bottom:1px solid #ddd;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .title{
            font-size:1.5rem;
            font-weight:bold;
            color:var(--primary-dark);
        }

        .chat-container{
            flex:1;
            overflow-y:auto;
            padding:30px;
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .message{
            max-width:70%;
            padding:18px;
            border-radius:20px;
            line-height:1.6;
            word-wrap:break-word;
        }

        .user{
            align-self:flex-end;
            background:var(--primary);
            color:white;
            border-bottom-right-radius:5px;
        }

        .bot{
            align-self:flex-start;
            background:white;
            color:var(--text);
            border:1px solid #ddd;
            border-bottom-left-radius:5px;
        }

        .input-area{
            background:white;
            padding:20px;
            border-top:1px solid #ddd;
        }

        .input-box{
            max-width:1100px;
            margin:auto;
            display:flex;
            gap:15px;
        }

        input{
            flex:1;
            border:none;
            background:#f8fafc;
            border-radius:18px;
            padding:18px;
            font-size:1rem;
            outline:none;
        }

        button{
            border:none;
            background:var(--primary);
            color:white;
            width:60px;
            border-radius:18px;
            cursor:pointer;
            font-size:1.2rem;
        }

        button:hover{
            background:var(--primary-dark);
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="title">
            SmartBio Assistant
        </div>

        <a href="/"
           style="
                text-decoration:none;
                color:#3F8443;
                font-weight:bold;
           ">
            Voltar
        </a>
    </header>

    <div id="chat-container" class="chat-container">

        <div class="message bot">
            Olá! Sou o assistente SmartBio. Como posso ajudar?
        </div>

    </div>

    <div class="input-area">
        <div class="input-box">

            <input
                type="text"
                id="mensagem"
                placeholder="Pergunte algo sobre biodigestão..."
            >

            <button id="enviar">
                <i class="fas fa-paper-plane"></i>
            </button>

        </div>
    </div>

<script>

const chatContainer =
    document.getElementById('chat-container');

const input =
    document.getElementById('mensagem');

const botao =
    document.getElementById('enviar');


function adicionarMensagem(texto, tipo){

    const div =
        document.createElement('div');

    div.classList.add('message');
    div.classList.add(tipo);

    div.innerText = texto;

    chatContainer.appendChild(div);

    chatContainer.scrollTop =
        chatContainer.scrollHeight;
}

async function enviarMensagem(){
    const mensagem = input.value.trim();
    if(!mensagem) return;

    adicionarMensagem(mensagem, 'user');
    input.value = '';

    // Mudança aqui: Usando URLSearchParams para simular um formulário padrão
    const params = new URLSearchParams();
    params.append('mensagem', mensagem);

    try {
        const response = await fetch('http://localhost:8080/mensagem', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: params
        });

        const resposta = await response.text();
        adicionarMensagem(resposta, 'bot');

    } catch(error){
        adicionarMensagem('Erro ao conectar com a IA.', 'bot');
        console.error(error);
    }
}

botao.addEventListener(
    'click',
    enviarMensagem
);
input.addEventListener(
    'keydown',
    function(e){

        if(e.key === 'Enter'){
            enviarMensagem();
        }
    }
)
</script>
</body>
</html>
